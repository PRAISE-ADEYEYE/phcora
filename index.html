<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3b3c"><title>PHCORA | PHC supply risk triage</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
:root{--bg:#f4f6f5;--card:#fff;--ink:#10282a;--mut:#5d7170;--line:#dde4e1;--brand:#0b3b3c;--ver:#1d4ed8;--ok:#2f7d5b;--r:12px;--sh:0 1px 2px rgba(16,40,42,.06),0 4px 14px rgba(16,40,42,.06)}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{height:100dvh}
body{font:17px/1.5 Inter,system-ui,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
header{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:var(--brand);color:#fff}
.logo{font-weight:800;letter-spacing:.04em;font-size:1.3rem}.logo small{display:block;font-weight:400;font-size:.68rem;opacity:.75;letter-spacing:0}
#q{flex:1;min-width:0;max-width:420px;margin-left:auto;padding:9px 12px;border-radius:10px;border:0;font:inherit;background:rgba(255,255,255,.14);color:#fff}
#q::placeholder{color:rgba(255,255,255,.7)}#q:focus{outline:2px solid #fff;background:rgba(255,255,255,.22)}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(380px,32vw) 1fr;grid-template-rows:minmax(0,1fr)}
aside{overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
#mapwrap{position:relative;min-height:0;min-width:0;height:100%}#map{position:absolute;inset:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.kpi b{display:block;font-size:2.2rem;font-weight:800;line-height:1.05}.kpi span{font-size:.9rem;font-weight:600;color:var(--mut)}
h2{font-size:.95rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--brand);margin:0 0 12px}
.row{display:flex;flex-wrap:wrap;gap:8px}
select,.chip,button{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;min-height:46px}
select{border-radius:8px;width:100%}.chip[aria-pressed=true]{background:var(--brand);color:#fff;border-color:var(--brand)}
button:focus-visible,select:focus-visible,.item:focus-visible{outline:2px solid var(--ver);outline-offset:2px}
.item{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer}
.item:hover,.item.sel{border-color:var(--brand);box-shadow:var(--sh)}.dot{width:12px;height:12px;border-radius:50%;flex:none}
.item b{font-size:1.08rem;font-weight:700}.item small{color:var(--mut);display:block;font-size:.9rem}.pill{margin-left:auto;font-size:.85rem;font-weight:700;padding:4px 10px;border-radius:999px;color:#fff;white-space:nowrap}
.meter{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:4px 0 10px}.meter i{display:block;height:100%}
.bd{font-size:.68rem;font-weight:600;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--mut);margin-left:6px}
.empty,.note{color:var(--mut);font-size:.95rem}.sq{display:block;width:100%;text-align:left;border-radius:12px;padding:12px 14px;font-size:1rem;font-weight:700;line-height:1.3;white-space:normal}.sq:hover{border-color:var(--brand);background:#eef4f2}#sugg{display:grid;grid-template-columns:1fr;gap:8px}#chat{display:flex;flex-direction:column;gap:8px}#ans{white-space:pre-wrap;font-size:.92rem}
#ask{display:flex;gap:8px}#ask input{flex:1;min-width:0;padding:12px 14px;font-size:1rem;border:1px solid var(--line);border-radius:10px;font:inherit}
.send{background:var(--brand);color:#fff;border-color:var(--brand)}nav.tabs{display:none}
@media (max-width:860px){
 main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}aside,#mapwrap{grid-row:1;grid-column:1}#sugg{grid-template-columns:1fr}
 body[data-v=map] aside{display:none}body:not([data-v=map]) #mapwrap{visibility:hidden}
 body[data-v=ask] .only-list,body:not([data-v=ask]) .only-ask{display:none}
 nav.tabs{display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
 nav.tabs button{flex:1;border:0;border-radius:0;min-height:58px;font-size:1.05rem;font-weight:700}nav.tabs button[aria-pressed=true]{color:var(--brand);box-shadow:inset 0 3px 0 var(--brand)}#q{max-width:none}}
</style></head><body data-v="list">
<header><div class="logo">PHCORA<small>PHC supply risk triage</small></div><input id="q" type="search" placeholder="Search clinic or LGA" aria-label="Search clinic or LGA"></header>
<main>
<aside>
 <div class="kpis only-list" id="kpis"></div>
 <div class="card only-list"><h2>Filters</h2><select id="st" aria-label="State"><option value="">All states</option></select><div class="row" id="acts" style="margin-top:10px"></div></div>
 <div class="card only-list"><h2>Priority list<span class="bd" id="cnt"></span></h2><div id="list"></div></div>
 <div class="card only-list" id="det" hidden></div>
 <div class="card only-ask" id="chat"><h2>Ask PHCORA</h2><div id="sugg"></div><div id="ans" class="empty">Pick a question or type your own. Answers are computed from PHCORA data and its documented assumptions.</div>
  <form id="ask"><input id="qq" placeholder="Type your question" aria-label="Question"><button class="send" type="submit">Ask</button></form></div>
 <p class="note only-list">Where facility histories are simulated, every number carries a provenance badge.</p>
</aside>
<div id="mapwrap"><div id="map"></div></div>
</main>
<nav class="tabs"><button data-t="list" aria-pressed="true">List</button><button data-t="map" aria-pressed="false">Map</button><button data-t="ask" aria-pressed="false">Ask</button></nav>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const CFG={facilities:"data/facilities.geojson",lga:"data/lga.geojson",agent:"/api/agent"};
const AC={Resupply:"#c2410c","Verify then resupply":"#1d4ed8",Verify:"#7c3aed",Watch:"#2f7d5b"};
const SUGG=["Which LGAs have the most facilities needing resupply?","Where is hidden risk concentrated?","Which facilities have the least reliable reporting?","Why is the top ranked facility flagged?","What data is real and what is simulated?"];
const $=s=>document.querySelector(s);let F=[],act=new Set(),sel=null,map;
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function view(v){document.body.dataset.v=v;document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.t==v));if(v=="map"&&map){map.resize();setTimeout(()=>map.resize(),120)}}
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>view(b.dataset.t));
function filt(){const q=$("#q").value.trim().toLowerCase(),st=$("#st").value;return F.filter(f=>(!st||f.state==st)&&(!act.size||act.has(f.action))&&(!q||(f.name+" "+f.lga).toLowerCase().includes(q))).sort((a,b)=>b.risk-a.risk)}
function render(){const L=filt(),n=a=>L.filter(f=>f.action==a).length,tr=L.length?Math.round(L.reduce((s,f)=>s+f.trust,0)/L.length*100):0;
 $("#kpis").innerHTML=[["Facilities",L.length],["Need resupply",n("Resupply")+n("Verify then resupply")],["Hidden risk",n("Verify")],["Avg report trust",tr+"%"]].map(k=>`<div class="card kpi"><b>${k[1]}</b><span>${k[0]}</span></div>`).join("");
 $("#cnt").textContent=L.length;
 $("#list").innerHTML=L.length?L.slice(0,60).map(f=>`<div class="item ${sel==f.id?"sel":""}" tabindex="0" role="button" data-id="${esc(f.id)}"><span class="dot" style="background:${AC[f.action]}"></span><div><b>${esc(f.name)}</b><small>${esc(f.lga)}, ${esc(f.state)}</small></div><span class="pill" style="background:${AC[f.action]}">${Math.round(f.risk*100)}%</span></div>`).join(""):`<div class="empty">${F.length?"No facilities match these filters.":"No facility data loaded yet. Run the data pipeline to create data/facilities.geojson."}</div>`;
 document.querySelectorAll(".item").forEach(e=>{e.onclick=()=>pick(e.dataset.id,true);e.onkeydown=k=>{if(k.key=="Enter")pick(e.dataset.id,true)}})}
function pick(id,fly){sel=id;const f=F.find(x=>x.id==id);if(!f)return;render();const d=$("#det");d.hidden=false;
 d.innerHTML=`<h2>Facility detail</h2><b style="font-size:1.1rem">${esc(f.name)}</b><div class="note">${esc(f.lga)}, ${esc(f.state)} ${f.type?"("+esc(f.type)+")":""}</div>
 <p style="margin:10px 0 2px"><span class="pill" style="background:${AC[f.action]};margin:0">${esc(f.action)}</span></p>
 <div class="note" style="margin-top:8px">Chance of shortfall before resupply<span class="bd">Predicted</span></div><div class="meter"><i style="width:${f.risk*100}%;background:${AC[f.action]}"></i></div>
 <div class="note">Report trust<span class="bd">Derived</span></div><div class="meter"><i style="width:${f.trust*100}%;background:var(--ok)"></i></div>
 ${(f.reasons||[]).length?`<h2>Why flagged</h2><ul style="margin:0;padding-left:18px">${f.reasons.map(r=>`<li>${esc(r)}</li>`).join("")}</ul>`:""}
 <p class="note">${f.simulated===false?"Reported data.":"Stock and reporting history are simulated."}</p>`;
 if(fly&&map){map.resize();map.flyTo({center:f.c,zoom:Math.max(map.getZoom(),11),essential:true});if(innerWidth<=860)view("map")}}
const geo=L=>({type:"FeatureCollection",features:L.map(f=>({type:"Feature",geometry:{type:"Point",coordinates:f.c},properties:{id:f.id,action:f.action,risk:f.risk}}))});
function sync(){render();if(map&&map.getSource("fac"))map.getSource("fac").setData(geo(filt()))}
function zoomTo(){const L=filt();if(!map||!L.length)return;const b=new maplibregl.LngLatBounds();L.forEach(f=>b.extend(f.c));map.fitBounds(b,{padding:60,maxZoom:11,duration:700})}
function initMap(){
 map=new maplibregl.Map({container:"map",center:[8.1,9.1],zoom:5.2,minZoom:4,attributionControl:{compact:true},style:{version:8,sources:{osm:{type:"raster",tiles:["https://a.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png","https://b.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png","https://c.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png","https://d.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png"],tileSize:256,maxzoom:19,attribution:"&copy; OpenStreetMap contributors &copy; CARTO"}},layers:[{id:"osm",type:"raster",source:"osm",paint:{}}]}});
 map.addControl(new maplibregl.NavigationControl({visualizePitch:false}),"top-right");
 map.addControl(new maplibregl.GeolocateControl({positionOptions:{enableHighAccuracy:true}}),"top-right");
 map.addControl(new maplibregl.ScaleControl({unit:"metric"}),"bottom-left");
 map.on("load",async()=>{
  try{const l=await (await fetch(CFG.lga)).json();map.addSource("lga",{type:"geojson",data:l});
   map.addLayer({id:"lga-fill",type:"fill",source:"lga",paint:{"fill-color":"#0b3b3c","fill-opacity":.04}});
   map.addLayer({id:"lga-line",type:"line",source:"lga",paint:{"line-color":"#0b3b3c","line-width":["interpolate",["linear"],["zoom"],5,.4,10,1.4],"line-opacity":.55}})}catch(e){}
  map.addSource("fac",{type:"geojson",data:geo(filt())});
  map.addLayer({id:"fac-pts",type:"circle",source:"fac",paint:{"circle-radius":["interpolate",["linear"],["zoom"],5,3,9,6,13,10],"circle-color":["match",["get","action"],"Resupply",AC.Resupply,"Verify then resupply",AC["Verify then resupply"],"Verify",AC.Verify,AC.Watch],"circle-stroke-color":"#fff","circle-stroke-width":1.5}});
  map.on("click","fac-pts",e=>pick(e.features[0].properties.id,false));
  map.on("mouseenter","fac-pts",()=>map.getCanvas().style.cursor="pointer");map.on("mouseleave","fac-pts",()=>map.getCanvas().style.cursor="");zoomTo()})}
async function load(){
 try{const g=await (await fetch(CFG.facilities)).json();F=g.features.map(x=>({...x.properties,c:x.geometry.coordinates}))}catch(e){F=[]}
 $("#st").innerHTML='<option value="">All states</option>'+[...new Set(F.map(f=>f.state))].sort().map(s=>`<option>${esc(s)}</option>`).join("");
 $("#acts").innerHTML=Object.keys(AC).map(a=>`<button class="chip" aria-pressed="false" data-a="${a}">${a}</button>`).join("");
 document.querySelectorAll(".chip[data-a]").forEach(b=>b.onclick=()=>{const a=b.dataset.a;act.has(a)?act.delete(a):act.add(a);b.setAttribute("aria-pressed",act.has(a));sync()});
 $("#st").onchange=()=>{sync();zoomTo()};$("#q").oninput=sync;initMap();render()}
$("#sugg").innerHTML=SUGG.map(s=>`<button class="sq">${s}</button>`).join("");
document.querySelectorAll("#sugg .sq").forEach(b=>b.onclick=()=>ask(b.textContent));
$("#ask").onsubmit=e=>{e.preventDefault();const v=$("#qq").value.trim();if(v)ask(v)};
async function ask(q){const a=$("#ans");a.className="";a.textContent="Thinking...";
 try{const r=await fetch(CFG.agent,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:q,state:$("#st").value||null})});
  if(!r.ok)throw 0;a.textContent=(await r.json()).answer||"No answer returned."}catch(e){a.className="empty";a.textContent="The assistant is not connected yet. It needs the PHCORA backend with Groq and Gemini keys."}}
load();
</script></body></html>
