.ip{position:fixed;z-index:50;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(440px,calc(100% - 32px));display:flex;gap:14px;align-items:flex-start}.ip svg{width:52px;height:52px;flex:none}

@media (max-width:900px){

const CFG={api:"",fb:{apiKey:"AIzaSyCvTsFAeM1uaCm8JFbI9LJGg2aPzWZkpIw",authDomain:"phcora-83970.firebaseapp.com",projectId:"phcora-83970",storageBucket:"phcora-83970.firebasestorage.app",messagingSenderId:"788455193969",appId:"1:788455193969:web:addb0d9218efbe908e4ad0"},
 fac:"/data/facilities.geojson",lga:"/data/lga.geojson",cal:"/data/calibration.json"};
const AC={Resupply:"#c2410c","Verify then resupply":"#1d4ed8",Verify:"#7c3aed",Watch:"#2f7d5b"};
const SUGG=["Which LGAs have the most facilities needing resupply?","Where is hidden risk concentrated?","Which facilities have the least reliable reporting?","Why is the top ranked facility flagged?","What data is real and what is simulated?","What should a supply officer do first this month?"];
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LOGO=`<svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#0b3b3c"/><path d="M32 10c-9 0-16 7-16 16 0 12 16 28 16 28s16-16 16-28c0-9-7-16-16-16z" fill="#fff"/><path d="M29 20h6v6h6v6h-6v6h-6v-6h-6v-6h6z" fill="#0b3b3c"/><circle cx="48" cy="16" r="6" fill="#f97316" stroke="#0b3b3c" stroke-width="3"/></svg>`;
const sv=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;

const NAV=[["overview","Overview"],["insight","Ask PHCORA"],["map","Map"]];
let user=null,ready=false,F=[],CAL=null,map=null,dataP=null,act=new Set(),chat={id:null,msgs:[]},convs=[],dip=null;
const auth=getAuth(initializeApp(CFG.fb));
onAuthStateChanged(auth,u=>{user=u;ready=true;route()});
function loadData(){return dataP||(dataP=Promise.all([fetch(CFG.fac).then(r=>r.ok?r.json():null).catch(()=>null),fetch(CFG.cal).then(r=>r.ok?r.json():null).catch(()=>null)]).then(([g,c])=>{CAL=c;F=g?g.features.map(x=>({...x.properties,c:x.geometry.coordinates})):[]}))}
/* router */
const go=(p,r)=>{history[r?"replaceState":"pushState"]({},"",p);route()};
document.addEventListener("click",e=>{const a=e.target.closest("[data-link]");if(a&&!e.metaKey&&!e.ctrlKey){e.preventDefault();go(a.getAttribute("href"))}});
addEventListener("popstate",route);
function route(){const p=location.pathname.replace(/\/+$/,"")||"/";if(map){map.remove();map=null}
 if(!ready){$("#app").innerHTML='<div class="gate"><h2>Loading PHCORA</h2></div>';return}
 if(!user){location.replace("/auth/?next="+encodeURIComponent(location.pathname));return}
 const s=p.split("/")[2];if(!NAV.some(n=>n[0]==s)){go("/dashboard/overview",1);return}shell(s)}
const instBtn=c=>`<button class="btn inst ${c||""}" hidden>Install app</button>`;
function shell(s){document.title=NAV.find(n=>n[0]==s)[1]+" | PHCORA";
 const links=NAV.map(n=>`<a href="/dashboard/${n[0]}" data-link ${n[0]==s?'aria-current="page"':""}>${IC[n[0]]}<span>${n[1]}</span></a>`).join("");
 $("#app").innerHTML=`<div class="shell"><aside class="side"><a class="lg" href="/" style="margin:0 8px 22px;color:#fff">${LOGO}PHCORA</a><nav class="nav">${links}</nav>${instBtn()}<div class="usr"><span>${esc(user.displayName||user.email)}</span><button class="btn" id="so">Sign out</button></div></aside>
 <div class="mtop"><a class="lg" href="/" style="color:#fff">${LOGO}</a><span class="sp"></span>${instBtn()}<button class="btn" id="so2">Sign out</button></div>
 <main class="pane ${s=="overview"?"":"fl"}" id="pane"></main><nav class="bnav">${links}</nav></div>`;
 $("#so").onclick=$("#so2").onclick=()=>signOut(auth);window.phSync&&phSync();
 ({overview,insight,map:mapView})[s]()}
async function overview(){const p=$("#pane");p.innerHTML='<h2>Loading</h2>';await loadData();
 const n=a=>F.filter(f=>f.action==a).length,has=F.length>0,tr=has?Math.round(F.reduce((s,f)=>s+f.trust,0)/F.length*100)+"%":"n/a";
 const K=[["Clinics tracked",has?F.length:"n/a"],["Need resupply",has?n("Resupply")+n("Verify then resupply"):"n/a"],["Hidden risk",has?n("Verify"):"n/a"],["Average report trust",tr]];
 const st=CAL?Object.keys(CAL.supplies):[],nm=s=>s[0].toUpperCase()+s.slice(1);
 const bars=(k,c)=>st.map(s=>{const v=CAL.supplies[s][k];return `<div><b>${nm(s)}</b> <span class="mut">${Math.round(v.share_available*100)}% (n=${v.n})</span><div class="bar"><i style="width:${v.share_available*100}%;background:${c}"></i></div></div>`}).join("");
 const lg={};F.forEach(f=>{const k=f.lga+", "+f.state,o=lg[k]||(lg[k]={n:0,a:0});o.n++;if(f.action=="Resupply"||f.action=="Verify then resupply")o.a++});const lgs=Object.entries(lg).sort((a,b)=>b[1].a-a[1].a).slice(0,6);
 const top=[...F].sort((a,b)=>b.risk-a.risk).slice(0,5);
 p.innerHTML=`<div class="ph"><h2>Welcome, ${esc((user.displayName||"").split(" ")[0]||"there")}</h2><p class="mut">Which primary health centres will run out first, and what to do about it.</p></div>
 ${has?"":`<div class="card" style="background:#f6f3ff;border-color:#e0d6fb;margin-bottom:16px"><h3>Facility data is not loaded yet</h3><p class="mut" style="margin-top:6px">Clinic counts and rankings appear once <b>data/facilities.geojson</b> is generated from the GRID3 facility list. Nothing on this page is invented in the meantime.</p></div>`}
 <div class="grid g4">${K.map(k=>`<div class="card kpi"><b>${k[1]}</b><span>${k[0]}</span></div>`).join("")}</div>
 <div class="grid g2" style="margin-top:16px"><div class="card"><h3>The problem</h3><p style="margin-top:8px">Reports arrive late, partly, or not at all, so a supply officer cannot tell clinics that are running low from clinics that are simply silent.</p></div>
 <div class="card"><h3>What PHCORA decides</h3><p style="margin-top:8px">With limited vehicles and stock this month, which clinics get stock, which get a verification call or visit, and which can wait.</p></div></div>
 <h2 style="margin:28px 0 14px">Four actions from two questions</h2><div class="grid g4">${[["Resupply","High risk, reliable reports"],["Verify then resupply","High risk, weak reports"],["Verify","Low risk, but reports too weak to trust"],["Watch","Low risk, reliable reports"]].map(a=>`<div class="card act" style="--c:${AC[a[0]]}"><b>${a[0]}</b><p class="mut">${a[1]}</p></div>`).join("")}</div>
 ${CAL?`<div class="grid g2" style="margin-top:28px"><div class="card"><h3>Medications available at PHCs<span class="bd">Real survey</span></h3><div style="margin-top:14px">${bars("Medications","var(--b2)")}</div></div><div class="card"><h3>Working vaccine fridge<span class="bd">Real survey</span></h3><div style="margin-top:14px">${bars("Working Fridge for Vaccine","var(--ver)")}</div></div></div><p class="mut" style="margin-top:10px;font-weight:600">Source: CheckMyPHC (Orodata Science, CC BY), state level survey summaries. They calibrate the simulator and are not facility records.</p>`:""}
 ${has?`<div class="card" style="margin-top:28px"><h3>Highest risk clinics<span class="bd">Predicted</span></h3>${top.map(f=>`<div class="row"><div style="flex:1"><b>${esc(f.name)}</b><div class="mut">${esc(f.lga)}, ${esc(f.state)}</div></div><span class="pill" style="background:${AC[f.action]}">${f.action}</span><b>${Math.round(f.risk*100)}%</b></div>`).join("")}<a class="btn" href="/dashboard/map" data-link style="margin-top:14px">See on map</a></div>`:""}
 ${has?`<div class="card" style="margin-top:28px"><h3>LGAs to act on first<span class="bd">Derived</span></h3>${lgs.map(([k,o])=>`<div class="row"><b style="flex:1">${esc(k)}</b><span class="mut">${o.a} of ${o.n} clinics</span></div><div class="bar"><i style="width:${o.n?o.a/o.n*100:0}%;background:var(--res)"></i></div>`).join("")}</div>`:""}
 <div class="card" style="margin-top:28px"><h3>How to read the numbers</h3><div class="chips" style="margin-top:12px">${[["Real","Observed in surveys or registries"],["Derived","Computed from reports"],["Predicted","Model estimate with a range"],["Simulated","Generated, never real"],["Assumed","A stated assumption"]].map(b=>`<span><span class="bd" style="margin:0">${b[0]}</span> <span class="mut" style="font-weight:600">${b[1]}</span></span>`).join("")}</div></div>`}
async function api(path,o={}){const t=await user.getIdToken();const r=await fetch(CFG.api+path,{...o,headers:{"Content-Type":"application/json",Authorization:"Bearer "+t}});if(!r.ok)throw new Error("http"+r.status);return r.json()}

 $("#hb").onclick=()=>$("#ch").classList.add("hs");$("#cf").onsubmit=e=>{e.preventDefault();const v=$("#ci").value.trim();if(v){$("#ci").value="";send(v)}};drawMsgs();listConvs()}

 else{m.innerHTML=chat.msgs.map(x=>`<div class="m ${x.r}">${md(x.t)}</div>`).join("");m.scrollTop=m.scrollHeight}}

/* Map: OpenFreeMap vector style recoloured in a Google Maps palette, the approach used in Traxx. No API key needed. */
const PAL={land:"#f3f2ee",water:"#aadaff",park:"#c8e6c3",bldg:"#e5e2db",minorF:"#fff",minorC:"#dad8d1",priF:"#fff4cc",priC:"#e3cc83",motF:"#f9c76b",motC:"#e0a84a",bnd:"#a9acb2",tx:"#5f6368",halo:"#fff"};
function recolor(st){const P=PAL,put=(l,g,k,v)=>{(l[g]=l[g]||{})[k]=v};
 st.layers.forEach(l=>{try{const id=l.id||"",t=l.type,sl=l["source-layer"]||"";
  if(t=="background")put(l,"paint","background-color",P.land);
  else if(t=="raster"||t=="fill-extrusion"){l.layout=l.layout||{};l.layout.visibility="none"}
  else if(t=="fill"){const c=sl=="water"?P.water:sl=="building"?P.bldg:/park|wood|forest|grass|nature|garden|farm/.test(id)||sl=="park"?P.park:/landuse|residential/.test(id)?"#f1efea":null;if(c){put(l,"paint","fill-color",c);if(l.paint["fill-pattern"])delete l.paint["fill-pattern"]}}
  else if(t=="line"){const cs=/casing/.test(id);if(sl=="water"||sl=="waterway")put(l,"paint","line-color",P.water);else if(sl=="boundary")put(l,"paint","line-color",P.bnd);
   else if(sl=="transportation")put(l,"paint","line-color",/motorway/.test(id)?(cs?P.motC:P.motF):/trunk|primary/.test(id)?(cs?P.priC:P.priF):cs?P.minorC:P.minorF)}
  else if(t=="symbol"){put(l,"paint","text-color",P.tx);put(l,"paint","text-halo-color",P.halo);put(l,"paint","text-halo-width",1.6)}}catch(e){}});return st}
async function baseStyle(){try{return recolor(await (await fetch("https://tiles.openfreemap.org/styles/liberty")).json())}catch(e){return "https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json"}}
const geo=L=>({type:"FeatureCollection",features:L.map(f=>({type:"Feature",geometry:{type:"Point",coordinates:f.c},properties:{id:f.id,action:f.action,risk:f.risk}}))});
const fl=()=>F.filter(f=>!act.size||act.has(f.action));
const CC=["match",["get","action"],"Resupply",AC.Resupply,"Verify then resupply",AC["Verify then resupply"],"Verify",AC.Verify,AC.Watch];
function fit(L){if(!map||!L.length)return;const b=new maplibregl.LngLatBounds();L.forEach(f=>b.extend(f.c));map.fitBounds(b,{padding:{top:90,bottom:60,left:60,right:60},maxZoom:12,duration:800})}
async function mapView(){$("#pane").innerHTML=`<div class="mv"><div id="map"></div><div class="card ms"><input id="sr" type="search" placeholder="Search clinic or LGA" aria-label="Search clinic or LGA"><div class="res" id="rs"></div><div class="chips">${Object.keys(AC).map(a=>`<button class="chip" style="--c:${AC[a]}" aria-pressed="false" data-a="${a}">${a}</button>`).join("")}</div></div><div class="card lgd">${Object.keys(AC).map(a=>`<span style="--c:${AC[a]}">${a}</span>`).join("")}</div><div class="card sel" id="sel" hidden></div></div>`;
 await loadData();const style=await baseStyle();if(!$("#map"))return;
 map=new maplibregl.Map({container:"map",style,center:[8.1,9.1],zoom:5.3,minZoom:4,attributionControl:false,fadeDuration:0});
 map.addControl(new maplibregl.NavigationControl(),"bottom-right");map.addControl(new maplibregl.GeolocateControl({positionOptions:{enableHighAccuracy:true},trackUserLocation:true}),"bottom-right");
 map.addControl(new maplibregl.ScaleControl({unit:"metric"}),"bottom-left");map.addControl(new maplibregl.AttributionControl({compact:true}),"bottom-right");
 map.on("load",async()=>{try{const l=await (await fetch(CFG.lga)).json();map.addSource("lga",{type:"geojson",data:l,generateId:true});
  map.addLayer({id:"lga-fill",type:"fill",source:"lga",paint:{"fill-color":"#0b3b3c","fill-opacity":["case",["boolean",["feature-state","h"],false],.12,.02]}});
  map.addLayer({id:"lga-line",type:"line",source:"lga",paint:{"line-color":"#0b3b3c","line-opacity":.55,"line-width":["interpolate",["linear"],["zoom"],5,.5,11,2]}});
  let hv=null;map.on("mousemove","lga-fill",e=>{if(hv!==null)map.setFeatureState({source:"lga",id:hv},{h:false});hv=e.features[0].id;map.setFeatureState({source:"lga",id:hv},{h:true})});
  map.on("mouseleave","lga-fill",()=>{if(hv!==null)map.setFeatureState({source:"lga",id:hv},{h:false});hv=null})}catch(e){}
  map.addSource("fac",{type:"geojson",data:geo(fl())});
  map.addLayer({id:"fac-halo",type:"circle",source:"fac",paint:{"circle-radius":["interpolate",["linear"],["zoom"],5,6,12,18],"circle-color":CC,"circle-opacity":.18}});
  map.addLayer({id:"fac-pts",type:"circle",source:"fac",paint:{"circle-radius":["interpolate",["linear"],["zoom"],5,3.5,12,9],"circle-color":CC,"circle-stroke-color":"#fff","circle-stroke-width":2}});
  map.on("click","fac-pts",e=>pick(e.features[0].properties.id));map.on("mouseenter","fac-pts",()=>map.getCanvas().style.cursor="pointer");map.on("mouseleave","fac-pts",()=>map.getCanvas().style.cursor="");fit(F)});
 $$(".chip[data-a]").forEach(b=>b.onclick=()=>{const a=b.dataset.a;act.has(a)?act.delete(a):act.add(a);b.setAttribute("aria-pressed",act.has(a));map.getSource("fac")?.setData(geo(fl()));fit(fl())});
 $("#sr").oninput=()=>{const q=$("#sr").value.trim().toLowerCase();$("#rs").innerHTML=q?F.filter(f=>(f.name+" "+f.lga).toLowerCase().includes(q)).slice(0,6).map(f=>`<button data-id="${esc(f.id)}">${esc(f.name)}<small>${esc(f.lga)}, ${esc(f.state)}</small></button>`).join("")||'<p class="mut" style="padding:8px">No match</p>':"";
  $$("#rs button").forEach(b=>b.onclick=()=>{pick(b.dataset.id,1);$("#rs").innerHTML=""})};
 if(!F.length)$("#rs").innerHTML='<p class="mut" style="padding:8px;font-weight:600">No clinic data loaded yet.</p>'}
function pick(id,fly){const f=F.find(x=>x.id==id),d=$("#sel");if(!f||!d)return;d.hidden=false;
 d.innerHTML=`<h3>${esc(f.name)}</h3><p class="mut" style="font-weight:600">${esc(f.lga)}, ${esc(f.state)} ${f.type?"("+esc(f.type)+")":""}</p><p style="margin:10px 0"><span class="pill" style="background:${AC[f.action]}">${esc(f.action)}</span></p>
 <b>Chance of shortfall <span class="bd">Predicted</span></b><div class="meter"><i style="width:${f.risk*100}%;background:${AC[f.action]}"></i></div><b>Report trust <span class="bd">Derived</span></b><div class="meter"><i style="width:${f.trust*100}%;background:var(--ok)"></i></div>
 ${(f.reasons||[]).length?`<b>Why flagged</b><ul style="margin:6px 0 0;padding-left:20px">${f.reasons.map(r=>`<li>${esc(r)}</li>`).join("")}</ul>`:""}<p class="mut" style="margin-top:10px;font-weight:600">${f.simulated===false?"Reported data.":"Stock and reporting history are simulated."}</p><button class="btn o" id="xs" style="margin-top:12px;min-height:44px">Close</button>`;
 $("#xs").onclick=()=>{d.hidden=true};if(fly&&map)map.flyTo({center:f.c,zoom:13,essential:true})}
route();
